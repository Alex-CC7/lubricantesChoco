<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BD Taller - Recuperar contraseña</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
</head>
<body>

  <form class="login-card" method="POST" action="{{ url_for('auth.recuperar') }}">

    <div class="avatar">
      <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <rect x="4" y="10" width="16" height="10" rx="2"></rect>
        <path d="M8 10V7a4 4 0 0 1 8 0v3"></path>
      </svg>
    </div>

    <h1 class="title">Recuperar contraseña</h1>
    <p class="subtitle">Verifica tu identidad</p>

    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        <div class="login-alerts">
          {% for category, message in messages %}
            <div class="login-alert login-alert-{{ category }}">{{ message }}</div>
          {% endfor %}
        </div>
      {% endif %}
    {% endwith %}

    <div class="field">
      <div class="field-label">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8" r="4"></circle>
          <path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"></path>
        </svg>
        Usuario
      </div>
      <div class="input-wrap">
        <span class="input-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="8" r="4"></circle>
            <path d="M4 21c0-4.4 3.6-8 8-8s8 3.6 8 8"></path>
          </svg>
        </span>
        <input type="text" name="username" placeholder="Nombre de usuario" required>
      </div>
    </div>

    <div class="field">
      <div class="field-label">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="16" rx="2"></rect>
          <path d="M3 9h18"></path>
        </svg>
        CI o Nro. Celular
      </div>
      <div class="input-wrap">
        <span class="input-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="16" rx="2"></rect>
            <path d="M3 9h18"></path>
          </svg>
        </span>
        <input type="text" name="dato" placeholder="Tu CI o tu número de celular" required>
      </div>
    </div>

    <div class="field">
      <div class="field-label">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="5" width="18" height="16" rx="2"></rect>
          <path d="M16 3v4M8 3v4M3 10h18"></path>
        </svg>
        Fecha de Nacimiento
      </div>
      <div class="input-wrap">
        <span class="input-icon">
          <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="5" width="18" height="16" rx="2"></rect>
            <path d="M16 3v4M8 3v4M3 10h18"></path>
          </svg>
        </span>
        <input type="date" name="fecha_nacimiento" required>
      </div>
    </div>

    <button type="submit" class="btn-login">
      <span class="btn-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 12h12"></path>
          <path d="M15 6l6 6-6 6"></path>
          <path d="M9 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h4"></path>
        </svg>
      </span>
      Verificar identidad
    </button>

    <div class="divider">o</div>

    <a href="{{ url_for('auth.login') }}" class="forgot">
      <span class="icon-sm">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 12H5"></path>
          <path d="M12 19l-7-7 7-7"></path>
        </svg>
      </span>
      Volver al inicio de sesión
    </a>
  </form>

</body>
</html>
